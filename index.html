<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Lex Diary</title>
    <style>
      :root {
        --bg: #f7d6e6;
        --pink: #eb7ab1;
        --pink-dark: #c93d7f;
        --rose: #fff2f8;
        --card: rgba(255, 255, 255, 0.7);
        --text: #3d1f2f;
        --muted: #754b62;
        --shadow: rgba(117, 75, 98, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #f7d6e6 0%, #f3c6dc 100%);
        color: var(--text);
      }

      .app {
        max-width: 1100px;
        margin: 0 auto;
        padding: 30px 18px 60px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        background: rgba(255, 255, 255, 0.4);
        border: 1px solid rgba(201, 61, 127, 0.15);
        border-radius: 20px;
        padding: 18px 22px;
        box-shadow: 0 8px 24px var(--shadow);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      .primary {
        background: var(--pink-dark);
        color: white;
      }

      .secondary {
        background: #ffeaf4;
        color: var(--pink-dark);
      }

      .danger {
        background: #ffefef;
        color: #a0304b;
      }

      .layout {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 24px;
        margin-top: 26px;
      }

      .panel {
        background: var(--card);
        border: 1px solid rgba(201, 61, 127, 0.14);
        border-radius: 22px;
        padding: 22px;
        box-shadow: 0 10px 28px var(--shadow);
      }

      .panel h2 {
        margin-top: 0;
        margin-bottom: 18px;
        font-size: 1.5rem;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 700;
        color: var(--muted);
      }

      input, textarea, select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid rgba(201, 61, 127, 0.2);
        border-radius: 12px;
        background: rgba(255,255,255,0.8);
        font: inherit;
        color: var(--text);
      }

      textarea {
        min-height: 170px;
        resize: vertical;
      }

      .meta-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .entry-list {
        display: grid;
        gap: 14px;
      }

      .entry-card {
        background: rgba(255,255,255,0.72);
        border: 1px solid rgba(201, 61, 127, 0.12);
        border-radius: 16px;
        padding: 16px;
      }

      .entry-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }

      .entry-title {
        font-weight: 700;
        font-size: 1.05rem;
      }

      .entry-meta {
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 8px;
      }

      .entry-text {
        white-space: pre-wrap;
        line-height: 1.5;
      }

      .tag {
        display: inline-block;
        background: #ffe7f3;
        color: var(--pink-dark);
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        padding: 6px 10px;
      }

      .empty-state {
        color: var(--muted);
        background: rgba(255,255,255,0.55);
        border-radius: 12px;
        padding: 18px;
      }

      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .meta-row {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>The Lex Diary</h1>
        <div class="actions">
          <button id="newEntryBtn" class="primary" type="button">New Entry</button>
          <button id="clearEntriesBtn" class="danger" type="button">Clear All</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel">
          <h2>Write a new entry</h2>
          <form id="entryForm">
            <div class="meta-row">
              <label>
                Date
                <input id="entryDate" type="date" />
              </label>
              <label>
                Mood
                <select id="entryMood">
                  <option value="Happy">Happy</option>
                  <option value="Calm">Calm</option>
                  <option value="Focused">Focused</option>
                  <option value="Tired">Tired</option>
                  <option value="Excited">Excited</option>
                  <option value="Reflective">Reflective</option>
                </select>
              </label>
            </div>

            <label>
              Title
              <input id="entryTitle" type="text" maxlength="80" placeholder="Entry title" required />
            </label>

            <label>
              Journal entry
              <textarea id="entryText" placeholder="Write what happened today..." required></textarea>
            </label>

            <div class="actions">
              <button id="saveEntryBtn" class="primary" type="submit">Save Entry</button>
              <button id="resetFormBtn" class="secondary" type="reset">Reset</button>
            </div>
          </form>
        </section>

        <aside class="panel">
          <h2>Recent entries</h2>
          <div id="entryList" class="entry-list" aria-live="polite"></div>
        </aside>
      </main>
    </div>

    <script>
      const STORAGE_KEY = 'lexDiaryEntries';
      const form = document.getElementById('entryForm');
      const entryDate = document.getElementById('entryDate');
      const entryMood = document.getElementById('entryMood');
      const entryTitle = document.getElementById('entryTitle');
      const entryText = document.getElementById('entryText');
      const entryList = document.getElementById('entryList');
      const newEntryBtn = document.getElementById('newEntryBtn');
      const clearEntriesBtn = document.getElementById('clearEntriesBtn');
      const resetFormBtn = document.getElementById('resetFormBtn');

      function setDefaultDate() {
        const today = new Date();
        entryDate.value = today.toISOString().split('T')[0];
      }

      function getEntries() {
        const saved = localStorage.getItem(STORAGE_KEY);
        try {
          return saved ? JSON.parse(saved) : [];
        } catch (error) {
          return [];
        }
      }

      function saveEntries(entries) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      }

      function renderEntries() {
        const entries = getEntries();

        if (!entries.length) {
          entryList.innerHTML = '<div class="empty-state">No entries yet. Start by writing your first diary note.</div>';
          return;
        }

        entryList.innerHTML = entries
          .slice()
          .reverse()
          .map(entry => `
            <article class="entry-card">
              <div class="entry-top">
                <div class="entry-title">${escapeHtml(entry.title)}</div>
                <span class="tag">${escapeHtml(entry.mood)}</span>
              </div>
              <div class="entry-meta">${escapeHtml(entry.date)}</div>
              <div class="entry-text">${escapeHtml(entry.text)}</div>
            </article>
          `)
          .join('');
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function handleSubmit(event) {
        event.preventDefault();

        const title = entryTitle.value.trim();
        const text = entryText.value.trim();
        const date = entryDate.value || new Date().toISOString().split('T')[0];
        const mood = entryMood.value;

        if (!title || !text) {
          alert('Please add both a title and your diary entry.');
          return;
        }

        const entries = getEntries();
        entries.push({ title, text, date, mood });
        saveEntries(entries);
        renderEntries();
        form.reset();
        setDefaultDate();
        entryMood.value = 'Happy';
        entryTitle.focus();
      }

      function clearEntries() {
        const confirmed = window.confirm('Delete all diary entries?');
        if (!confirmed) return;

        localStorage.removeItem(STORAGE_KEY);
        renderEntries();
      }

      form.addEventListener('submit', handleSubmit);
      newEntryBtn.addEventListener('click', () => {
        form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        entryTitle.focus();
      });
      clearEntriesBtn.addEventListener('click', clearEntries);
      resetFormBtn.addEventListener('click', () => {
        setDefaultDate();
        entryMood.value = 'Happy';
      });

      setDefaultDate();
      renderEntries();
    </script>
  </body>
</html>
