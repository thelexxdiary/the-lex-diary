<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>The Lex Diary</title>
    <style>
      html,body{margin:0;padding:0;background:#f5b1cf;}
      body{min-height:100vh;overflow-x:auto;}
      .page{position:relative;width:1536px;max-width:100%;margin:0 auto;line-height:0;}
      .design{display:block;width:100%;height:auto;}

      .ui-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .panel {
        position: absolute;
        right: 6.5%;
        top: 10%;
        width: 26%;
        min-width: 320px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(164,69,107,0.18);
        border-radius: 22px;
        padding: 18px 18px 14px;
        box-shadow: 0 16px 28px rgba(124, 54, 92, 0.14);
        pointer-events: auto;
      }

      .panel h2 {
        margin: 0 0 14px;
        font: 700 18px/1.2 Arial,sans-serif;
        letter-spacing: .08em;
        color: #bb4984;
        text-transform: uppercase;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 10px 14px;
        font: 700 14px/1.2 Arial,sans-serif;
        cursor: pointer;
      }

      .primary {
        background: #b7407a;
        color: white;
      }

      .secondary {
        background: #ffeaf4;
        color: #a63f72;
      }

      .danger {
        background: #ffe2e7;
        color: #a93553;
      }

      label {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
        font: 700 12px/1.2 Arial,sans-serif;
        color: #754e63;
      }

      input, textarea, select {
        width: 100%;
        border: 1px solid rgba(164,69,107,0.2);
        border-radius: 12px;
        background: rgba(255,255,255,0.7);
        color: #402538;
        font: 400 14px/1.4 Arial,sans-serif;
        padding: 10px 12px;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .entry-list {
        margin-top: 14px;
        display: grid;
        gap: 12px;
        max-height: 230px;
        overflow: auto;
      }

      .entry-card {
        background: rgba(255,255,255,0.75);
        border: 1px solid rgba(164,69,107,0.12);
        border-radius: 12px;
        padding: 12px;
      }

      .entry-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .entry-title {
        font: 700 13px/1.3 Arial,sans-serif;
        color: #402538;
      }

      .entry-mood {
        background: #ffe5f2;
        color: #b7407a;
        border-radius: 999px;
        padding: 4px 8px;
        font: 700 10px/1.2 Arial,sans-serif;
      }

      .entry-date {
        font: 700 11px/1.2 Arial,sans-serif;
        color: #7d596d;
        margin-bottom: 6px;
      }

      .entry-text {
        white-space: pre-wrap;
        font: 400 12px/1.5 Arial,sans-serif;
        color: #402538;
      }

      .empty-state {
        background: rgba(255,255,255,0.5);
        border-radius: 12px;
        padding: 12px;
        font: 400 12px/1.4 Arial,sans-serif;
        color: #704d62;
      }

      @media (max-width: 800px){
        body{background:#f5b1cf;}
        .page{width:1536px;max-width:none;}
        .panel{right:2%;top:8%;width:32%;min-width:280px;}
      }
    </style>
  </head>
  <body>
    <div class="page">
      <img class="design" alt="The Lex Diary design" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QCMRXhpZgAATU0AKgAAAAgABQESAAMAAAABAAEAAAEaAAUAAAABAAAASgEbAAUAAAABAAAAUgEoAAMAAAABAAIAAId[...]" />

      <div class="ui-layer">
        <div class="panel">
          <h2>Diary</h2>

          <div class="toolbar">
            <button class="primary" id="newEntryBtn" type="button">New Entry</button>
            <button class="danger" id="clearEntriesBtn" type="button">Clear All</button>
          </div>

          <form id="entryForm">
            <label>
              Date
              <input id="entryDate" type="date">
            </label>

            <label>
              Mood
              <select id="entryMood">
                <option value="Happy">Happy</option>
                <option value="Calm">Calm</option>
                <option value="Focused">Focused</option>
                <option value="Tired">Tired</option>
                <option value="Excited">Excited</option>
                <option value="Reflective">Reflective</option>
              </select>
            </label>

            <label>
              Title
              <input id="entryTitle" type="text" maxlength="80" placeholder="Entry title" required>
            </label>

            <label>
              Journal entry
              <textarea id="entryText" placeholder="Write what happened today..." required></textarea>
            </label>

            <div class="toolbar">
              <button class="primary" type="submit">Save Entry</button>
              <button class="secondary" id="resetFormBtn" type="reset">Reset</button>
            </div>
          </form>

          <div id="entryList" class="entry-list" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script>
      const STORAGE_KEY = 'lexDiaryEntries';
      const form = document.getElementById('entryForm');
      const entryDate = document.getElementById('entryDate');
      const entryMood = document.getElementById('entryMood');
      const entryTitle = document.getElementById('entryTitle');
      const entryText = document.getElementById('entryText');
      const entryList = document.getElementById('entryList');
      const newEntryBtn = document.getElementById('newEntryBtn');
      const clearEntriesBtn = document.getElementById('clearEntriesBtn');
      const resetFormBtn = document.getElementById('resetFormBtn');

      function setDefaultDate() {
        const today = new Date();
        entryDate.value = today.toISOString().split('T')[0];
      }

      function getEntries() {
        const saved = localStorage.getItem(STORAGE_KEY);
        try { return saved ? JSON.parse(saved) : []; }
        catch { return []; }
      }

      function saveEntries(entries) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderEntries() {
        const entries = getEntries();

        if (!entries.length) {
          entryList.innerHTML = '<div class="empty-state">No entries yet. Start by writing your first diary note.</div>';
          return;
        }

        entryList.innerHTML = entries
          .slice()
          .reverse()
          .map(entry => `
            <article class="entry-card">
              <div class="entry-header">
                <div class="entry-title">${escapeHtml(entry.title)}</div>
                <span class="entry-mood">${escapeHtml(entry.mood)}</span>
              </div>
              <div class="entry-date">${escapeHtml(entry.date)}</div>
              <div class="entry-text">${escapeHtml(entry.text)}</div>
            </article>
          `)
          .join('');
      }

      function handleSubmit(event) {
        event.preventDefault();

        const title = entryTitle.value.trim();
        const text = entryText.value.trim();
        const date = entryDate.value || new Date().toISOString().split('T')[0];
        const mood = entryMood.value;

        if (!title || !text) {
          alert('Please add both a title and your diary entry.');
          return;
        }

        const entries = getEntries();
        entries.push({ title, text, date, mood });
        saveEntries(entries);
        renderEntries();
        form.reset();
        setDefaultDate();
        entryMood.value = 'Happy';
        entryTitle.focus();
      }

      function clearEntries() {
        if (!window.confirm('Delete all diary entries?')) return;
        localStorage.removeItem(STORAGE_KEY);
        renderEntries();
      }

      form.addEventListener('submit', handleSubmit);
      newEntryBtn.addEventListener('click', () => {
        entryTitle.focus();
      });
      clearEntriesBtn.addEventListener('click', clearEntries);
      resetFormBtn.addEventListener('click', () => {
        setDefaultDate();
        entryMood.value = 'Happy';
      });

      setDefaultDate();
      renderEntries();
    </script>
  </body>
</html>
